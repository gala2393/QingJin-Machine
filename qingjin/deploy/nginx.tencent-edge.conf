# Install as /opt/qingjin/edge/conf.d/qingjin.conf after certificate validation.
server {
    listen 80;
    server_name qingjinmachinery.cn www.qingjinmachinery.cn admin.qingjinmachinery.cn;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name qingjinmachinery.cn;
    ssl_certificate /etc/nginx/ssl/qingjin/qingjinmachinery.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/qingjin/qingjinmachinery.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s;
    set $qingjin_upstream http://qingjin-web:80;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass $qingjin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name admin.qingjinmachinery.cn;
    ssl_certificate /etc/nginx/ssl/qingjin/admin.qingjinmachinery.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/qingjin/admin.qingjinmachinery.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s;
    set $qingjin_upstream http://qingjin-web:80;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass $qingjin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location = /__preview_auth {
        access_log off;
        proxy_pass $qingjin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.qingjinmachinery.cn;
    # The primary certificate must also cover www.qingjinmachinery.cn.
    ssl_certificate /etc/nginx/ssl/qingjin/qingjinmachinery.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/qingjin/qingjinmachinery.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://qingjinmachinery.cn$request_uri;
}
