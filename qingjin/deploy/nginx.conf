# Rendered by the nginx image's envsubst (mounted as a template); ${PREVIEW_HOST} comes from compose.
# TLS terminates at Cloudflare (set SSL mode to "Full" with an origin certificate if you also want HTTPS here).

# Keep Cloudflare's original scheme so the API/preview see https and mark cookies Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Video files never change once written (each upload gets a new id), so they cache for long.
    location ^~ /uploads/videos/ {
        alias /srv/uploads/videos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        alias /srv/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Admin SPA (history-mode routing): unknown paths fall back to its index.html.
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location ^~ /admin/assets/ {
        alias /srv/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /admin {
        return 301 /admin/;
    }

    # Published showcase site. "current" is a symlink the API switches to releases/vN on each publish;
    # nginx resolves it per request, so a publish or rollback is live immediately.
    location / {
        root /srv/publish/current;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.html;
        # HTML must revalidate so a new release shows up without purging caches.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ^~ /_astro/ {
        root /srv/publish/current;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /images/ {
        root /srv/publish/current;
        expires 1h;
    }
}

# Preview of unpublished changes (token-protected by the API's preview server).
server {
    listen 80;
    server_name ${PREVIEW_HOST};

    server_tokens off;

    location / {
        proxy_pass http://api:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
