server {
    listen 80 default_server;
    server_name api.learnstudy.cloud;
    server_tokens off;
    root /srv/publish/current;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /api/track {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ { return 404; }
    location /admin { return 404; }
    # Product videos are linked from published pages but stay in the uploads volume.
    location ^~ /uploads/videos/ {
        alias /srv/uploads/videos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control no-cache;
    }
}
server {
    listen 80;
    server_name admin.learnstudy.cloud;
    server_tokens off;
    client_max_body_size 20m;
    absolute_redirect off;
    location = / { return 302 /admin/; }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location /uploads/ { alias /srv/uploads/; }
    # Preview's root-absolute assets share this host, outside /admin/ and /api/.
    location / {
        proxy_pass http://api:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
